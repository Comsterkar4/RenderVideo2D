[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "render-video"
version = "0.1.0"
description = "Turn structured stories into narrated videos"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "imageio-ffmpeg>=0.6.0",
    "jinja2>=3.1.5",
    "sqlalchemy>=2.0.36",
    "uvicorn>=0.34.0",
]

[tool.setuptools.packages.find]
include = ["backend*", "frontend*"]
